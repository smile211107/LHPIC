<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư Viện Ảnh - CLB Tin học LHPIC</title>
  <meta name="description" content="Hình ảnh hoạt động, các buổi học chuyên đề tại Hội trường E và các kỳ Contest của CLB Tin học Trường THPT Chuyên Lê Hồng Phong.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0F172A',
              terracotta: '#C2410C',
              orange: '#EA580C',
              light: '#F8FAFC',
            }
          },
          fontFamily: {
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/panda-logo.svg">
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

  <div id="navbar-container"></div>

  <main class="flex-grow">
    
    <!-- Banner Header -->
    <section class="bg-slate-900 text-white py-14 sm:py-18 border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-3">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-600/20 text-orange-400 border border-orange-500/30 text-xs font-mono font-semibold uppercase">
          Kỷ Niệm &amp; Khoảnh Khắc
        </div>
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight font-heading">
          Thư Viện Ảnh <span class="text-orange-500">LHPIC</span>
        </h1>
        <p class="text-sm sm:text-base text-slate-300 max-w-2xl mx-auto">
          Bộ sưu tập hình ảnh chân thực ghi lại những khoảnh khắc say mê lập trình tại Hội trường E và các kỳ thi thử thách.
        </p>
      </div>
    </section>

    <!-- Filter Category Bar -->
    <section class="sticky top-20 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 py-4 shadow-xs">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0" id="gallery-category-tabs">
          <!-- Dynamically populated or static pills -->
          <button type="button" data-category="all" 
                  class="cat-btn px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer bg-slate-900 text-white">
            Tất cả ảnh
          </button>
          <button type="button" data-category="Hội trường E" 
                  class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all cursor-pointer">
            Hội trường E
          </button>
          <button type="button" data-category="Học sinh & Lập trình" 
                  class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all cursor-pointer">
            Học sinh &amp; Lập trình
          </button>
          <button type="button" data-category="Ban Chuyên môn" 
                  class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all cursor-pointer">
            Ban Chuyên môn
          </button>
          <button type="button" data-category="Contest" 
                  class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all cursor-pointer">
            Contest
          </button>
          <button type="button" data-category="Sự kiện đặc biệt" 
                  class="cat-btn px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all cursor-pointer">
            Sự kiện đặc biệt
          </button>
        </div>
      </div>
    </section>

    <!-- Gallery Grid -->
    <section class="py-12 bg-slate-50 min-h-[450px]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Populated by gallery.js -->
        </div>

        <!-- Empty State -->
        <div id="gallery-empty-state" class="hidden text-center py-16 space-y-3">
          <div class="w-16 h-16 mx-auto rounded-full bg-slate-200 text-slate-400 flex items-center justify-center">
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          </div>
          <h3 class="text-base font-bold text-slate-700">Chưa có ảnh trong danh mục này</h3>
          <p class="text-xs text-slate-500">Bạn có thể dùng trang Quản trị (Admin) để tải thêm ảnh mới.</p>
        </div>

      </div>
    </section>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="fixed inset-0 z-50 hidden bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
      
      <!-- Close button -->
      <button type="button" id="lightbox-close-btn" 
              class="absolute top-5 right-5 z-20 w-11 h-11 rounded-full bg-slate-800/80 hover:bg-slate-700 text-white flex items-center justify-center cursor-pointer transition-colors" 
              aria-label="Đóng xem ảnh">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>

      <!-- Prev button -->
      <button type="button" id="lightbox-prev-btn" 
              class="absolute left-4 top-1/2 -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-slate-800/70 hover:bg-orange-600 text-white flex items-center justify-center cursor-pointer transition-all" 
              aria-label="Ảnh trước">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>

      <!-- Next button -->
      <button type="button" id="lightbox-next-btn" 
              class="absolute right-4 top-1/2 -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-slate-800/70 hover:bg-orange-600 text-white flex items-center justify-center cursor-pointer transition-all" 
              aria-label="Ảnh tiếp theo">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <!-- Content Container -->
      <div class="relative max-w-5xl w-full max-h-[85vh] flex flex-col items-center justify-center animate-modal">
        <div class="relative w-full max-h-[68vh] flex items-center justify-center overflow-hidden rounded-2xl">
          <img id="lightbox-img" src="" alt="Zoom" class="max-w-full max-h-[68vh] object-contain rounded-2xl shadow-2xl" />
        </div>
        
        <!-- Caption card -->
        <div class="mt-4 bg-slate-900/90 text-white p-4 rounded-2xl max-w-2xl w-full border border-slate-800 text-center space-y-1">
          <div class="flex items-center justify-center gap-2">
            <span id="lightbox-category" class="text-xs font-mono uppercase text-orange-400 font-bold"></span>
            <span class="text-slate-500">•</span>
            <span id="lightbox-date" class="text-xs text-slate-400"></span>
          </div>
          <h3 id="lightbox-title" class="text-base font-bold font-heading"></h3>
          <p id="lightbox-caption" class="text-xs text-slate-300"></p>
        </div>
      </div>

    </div>

  </main>

  <div id="footer-container"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/gallery.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.LHPIC.renderNavbar('gallery');
      window.LHPIC.renderFooter();
      if (window.initGalleryPage) window.initGalleryPage();
    });
  </script>
</body>
</html>
