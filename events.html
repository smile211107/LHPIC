<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sự Kiện & Hoạt Động - CLB Tin học LHPIC</title>
  <meta name="description" content="Lịch các buổi sinh hoạt chuyên đề Tin học, các kỳ thi Contest luyện tập HSGTP của CLB Tin học LHPIC tại Hội trường E.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0F172A',
              terracotta: '#C2410C',
              orange: '#EA580C',
              light: '#F8FAFC',
            }
          },
          fontFamily: {
            heading: ['"Plus Jakarta Sans"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/panda-logo.svg">
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen">

  <div id="navbar-container"></div>

  <main class="flex-grow">
    
    <!-- Banner Header -->
    <section class="bg-slate-900 text-white py-14 sm:py-18 border-b border-slate-800">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-3">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-600/20 text-orange-400 border border-orange-500/30 text-xs font-mono font-semibold uppercase">
          Lịch trình &amp; Tài liệu
        </div>
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight font-heading">
          Sự Kiện &amp; Hoạt Động <span class="text-orange-500">LHPIC</span>
        </h1>
        <p class="text-sm sm:text-base text-slate-300 max-w-2xl mx-auto">
          Theo dõi lịch các buổi sinh hoạt chuyên đề tại Hội trường E và các kỳ Contest thực chiến hàng tuần.
        </p>
      </div>
    </section>

    <!-- Filter & Search Controls Bar -->
    <section class="sticky top-20 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 py-4 shadow-xs">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row items-center justify-between gap-4">
          
          <!-- Category Tabs -->
          <div class="flex items-center gap-1.5 p-1 bg-slate-100 rounded-xl overflow-x-auto w-full md:w-auto" id="event-status-tabs">
            <button type="button" data-status="all" 
                    class="tab-btn px-4 py-2 rounded-lg text-xs font-bold transition-all cursor-pointer bg-white text-slate-900 shadow-xs">
              Tất cả (<span id="count-all">0</span>)
            </button>
            <button type="button" data-status="upcoming" 
                    class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all cursor-pointer">
              Sắp diễn ra (<span id="count-upcoming">0</span>)
            </button>
            <button type="button" data-status="ongoing" 
                    class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all cursor-pointer">
              Đang diễn ra (<span id="count-ongoing">0</span>)
            </button>
            <button type="button" data-status="completed" 
                    class="tab-btn px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition-all cursor-pointer">
              Đã kết thúc (<span id="count-completed">0</span>)
            </button>
          </div>

          <!-- Search Input -->
          <div class="relative w-full md:w-72">
            <input type="text" id="search-events-input" 
                   placeholder="Tìm kiếm chuyên đề, thuật toán..." 
                   class="w-full pl-9 pr-4 py-2 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-500 transition-all">
            <div class="absolute left-3 top-2.5 text-slate-400">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- Events List Grid -->
    <section class="py-12 bg-slate-50 min-h-[400px]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div id="events-grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Populated by events.js -->
        </div>

        <!-- Empty State -->
        <div id="events-empty-state" class="hidden text-center py-16 space-y-3">
          <div class="w-16 h-16 mx-auto rounded-full bg-slate-200 text-slate-400 flex items-center justify-center">
            <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" x2="16" y1="12" y2="12"/></svg>
          </div>
          <h3 class="text-base font-bold text-slate-700">Không tìm thấy sự kiện phù hợp</h3>
          <p class="text-xs text-slate-500">Vui lòng thử chọn trạng thái khác hoặc xóa từ khóa tìm kiếm.</p>
        </div>

      </div>
    </section>

    <!-- Event Detail Modal -->
    <div id="event-modal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4">
      <div class="relative bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden animate-modal border border-slate-200">
        
        <!-- Modal Header Image -->
        <div class="relative h-56 sm:h-64 bg-slate-900">
          <img id="modal-image" src="" alt="Cover" class="w-full h-full object-cover opacity-85" />
          <button type="button" id="modal-close-btn" 
                  class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-900/80 text-white flex items-center justify-center hover:bg-slate-900 transition-colors cursor-pointer" 
                  aria-label="Đóng cửa sổ">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
          <div class="absolute bottom-4 left-4" id="modal-status-badge"></div>
        </div>

        <!-- Modal Body Content -->
        <div class="p-6 sm:p-8 space-y-5">
          <div>
            <span id="modal-category" class="text-xs font-mono font-bold text-orange-600 uppercase tracking-wider block mb-1"></span>
            <h2 id="modal-title" class="text-xl sm:text-2xl font-black text-slate-900 font-heading leading-snug"></h2>
          </div>

          <!-- Metadata Grid -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-700">
            <div class="flex items-center gap-2.5">
              <span class="text-orange-600" data-icon="calendar"></span>
              <div>
                <span class="text-slate-400 block font-medium">Thời gian:</span>
                <span id="modal-datetime" class="font-bold text-slate-900"></span>
              </div>
            </div>
            <div class="flex items-center gap-2.5">
              <span class="text-orange-600" data-icon="mapPin"></span>
              <div>
                <span class="text-slate-400 block font-medium">Địa điểm:</span>
                <span id="modal-location" class="font-bold text-slate-900"></span>
              </div>
            </div>
            <div class="flex items-center gap-2.5 sm:col-span-2">
              <span class="text-orange-600" data-icon="user"></span>
              <div>
                <span class="text-slate-400 block font-medium">Phụ trách:</span>
                <span id="modal-instructor" class="font-bold text-slate-900"></span>
              </div>
            </div>
          </div>

          <!-- Detailed Description -->
          <div class="space-y-2">
            <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 font-heading">Nội dung chi tiết</h4>
            <p id="modal-content" class="text-sm text-slate-600 leading-relaxed whitespace-pre-line"></p>
          </div>

          <!-- Action Buttons -->
          <div class="pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3" id="modal-actions">
            <!-- Populated dynamically -->
          </div>

        </div>

      </div>
    </div>

  </main>

  <div id="footer-container"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/events.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.LHPIC.renderNavbar('events');
      window.LHPIC.renderFooter();
      if (window.initEventsPage) window.initEventsPage();
    });
  </script>
</body>
</html>
