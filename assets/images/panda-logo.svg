<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="headbandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle (Badge) -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGlow)" stroke="#334155" stroke-width="4" />

  <!-- Code Window Behind -->
  <g filter="url(#softShadow)">
    <rect x="80" y="60" width="240" height="150" rx="12" fill="url(#codeGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2" />
    <!-- Window controls -->
    <circle cx="100" cy="78" r="4.5" fill="#EF4444" />
    <circle cx="114" cy="78" r="4.5" fill="#F59E0B" />
    <circle cx="128" cy="78" r="4.5" fill="#10B981" />
    <text x="145" y="81" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">lhpic-algo.cpp</text>
    <!-- Code Lines -->
    <rect x="95" y="96" width="60" height="4" rx="2" fill="#38BDF8" opacity="0.8" />
    <rect x="162" y="96" width="40" height="4" rx="2" fill="#F43F5E" opacity="0.8" />
    <rect x="105" y="108" width="85" height="4" rx="2" fill="#A855F7" opacity="0.7" />
    <rect x="196" y="108" width="50" height="4" rx="2" fill="#38BDF8" opacity="0.7" />
    <rect x="105" y="120" width="120" height="4" rx="2" fill="#10B981" opacity="0.8" />
    <rect x="115" y="132" width="70" height="4" rx="2" fill="#FBBF24" opacity="0.7" />
    <rect x="190" y="132" width="65" height="4" rx="2" fill="#94A3B8" opacity="0.7" />
  </g>

  <!-- Panda Ears -->
  <circle cx="135" cy="150" r="30" fill="#0F172A" stroke="#334155" stroke-width="3" />
  <circle cx="135" cy="150" r="16" fill="#334155" opacity="0.5" />
  <circle cx="265" cy="150" r="30" fill="#0F172A" stroke="#334155" stroke-width="3" />
  <circle cx="265" cy="150" r="16" fill="#334155" opacity="0.5" />

  <!-- Panda Head -->
  <g filter="url(#softShadow)">
    <ellipse cx="200" cy="210" rx="72" ry="65" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" />
  </g>

  <!-- Eye Patches -->
  <ellipse cx="170" cy="205" rx="20" ry="24" fill="#0F172A" transform="rotate(-15 170 205)" />
  <ellipse cx="230" cy="205" rx="20" ry="24" fill="#0F172A" transform="rotate(15 230 205)" />

  <!-- Eyes with reflections -->
  <circle cx="172" cy="205" r="7" fill="#FFFFFF" />
  <circle cx="174" cy="203" r="3.5" fill="#38BDF8" />
  <circle cx="175" cy="202" r="1.5" fill="#FFFFFF" />

  <circle cx="228" cy="205" r="7" fill="#FFFFFF" />
  <circle cx="226" cy="203" r="3.5" fill="#38BDF8" />
  <circle cx="225" cy="202" r="1.5" fill="#FFFFFF" />

  <!-- Cute Nose & Mouth -->
  <ellipse cx="200" cy="226" rx="8" ry="6" fill="#0F172A" />
  <path d="M 194 234 Q 200 240 206 234" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <ellipse cx="152" cy="225" rx="7" ry="4" fill="#FDA4AF" opacity="0.5" />
  <ellipse cx="248" cy="225" rx="7" ry="4" fill="#FDA4AF" opacity="0.5" />

  <!-- Headband with LHPIC -->
  <path d="M 132 178 Q 200 172 268 178 L 266 195 Q 200 190 134 195 Z" fill="url(#headbandGrad)" filter="url(#softShadow)" />
  <text x="200" y="190" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="12" letter-spacing="2" text-anchor="middle">LHPIC</text>
  <!-- Headband knot ends -->
  <path d="M 264 186 C 278 185 285 195 288 208 C 280 204 274 198 266 194 Z" fill="#C2410C" />
  <path d="M 265 188 C 282 195 284 212 282 222 C 276 212 272 204 266 193 Z" fill="#EA580C" />

  <!-- Panda Arms Holding Laptop -->
  <ellipse cx="140" cy="285" rx="22" ry="18" fill="#0F172A" />
  <ellipse cx="260" cy="285" rx="22" ry="18" fill="#0F172A" />

  <!-- Laptop Screen & Base -->
  <g filter="url(#softShadow)">
    <!-- Laptop screen back -->
    <rect x="135" y="240" width="130" height="75" rx="6" fill="url(#laptopGrad)" stroke="#64748B" stroke-width="2" />
    <!-- Apple / LHPIC logo on back of laptop -->
    <rect x="145" y="248" width="110" height="60" rx="4" fill="#090D16" />
    <text x="200" y="280" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
    <text x="200" y="296" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" letter-spacing="1" text-anchor="middle">LHP INFORMATICS</text>
    <!-- Laptop base -->
    <path d="M 120 315 L 280 315 L 295 328 L 105 328 Z" fill="#475569" stroke="#64748B" stroke-width="1.5" />
    <path d="M 175 316 L 225 316 L 223 319 L 177 319 Z" fill="#94A3B8" />
  </g>

  <!-- Paws on top of laptop base -->
  <ellipse cx="145" cy="316" rx="14" ry="10" fill="#0F172A" />
  <ellipse cx="255" cy="316" rx="14" ry="10" fill="#0F172A" />

  <!-- Outer Tagline -->
  <path id="curve" d="M 90 355 A 130 130 0 0 0 310 355" fill="none" />
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="3">
    <textPath href="#curve" startOffset="50%" text-anchor="middle">
      LE HONG PHONG INFORMATICS CLUB
    </textPath>
  </text>
</svg>
